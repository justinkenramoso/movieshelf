<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieShelf</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <header>

        <h1 class="logo">MovieShelf</h1>

        <nav>
            <a href="">HOME</a>
            <a href="">ABOUT</a>
        </nav>

    </header>

    <main>

        <section id="movies-section">

            <h2>MY MOVIES</h2>

            <div class="movie-controls">

                <div class="movie-controls-top">
                     <input class="search-bar" type="text" name="movie-search" id="movie-search" placeholder="Search">
                </div>

                <div class="movie-controls-bottom">

                    <div class="filter-and-sort">
                        <div>
                            <label for="movie-sort">Sort by: </label>
                            <select name="movie-sort" id="movie-sort">
                                <option value="date-added">Date Added</option>
                                <option value="alphabetical">Alphabetical</option>
                                <option value="release-date">Release Date</option>
                            </select>
                        </div>

                        <div>
                            <label for="movie-filter">Filter by Genre: </label>
                            <select name="movie-filter" id="movie-filter">
                                <option value="all">All</option>
                                <option value="action">Action</option>
                                <option value="comedy">Comedy</option>
                                <option value="drama">Drama</option>
                                <option value="sci-fi">Sci-Fi</option>
                                <option value="fantasy">Fantasy</option>
                                <option value="animation">Animation</option>
                                <option value="mystery">Mystery</option>
                                <option value="horror">Horror</option>
                                <option value="romance">Romance</option>
                                <option value="documentary">Documentary</option>
                                <option value="musical">Musical</option>
                            </select>
                        </div>
                    </div>
                    
                    
                    <button id="add-movie-button" class="add-button">Add a Movie</button>

                </div>
            
            </div>

            <div class="cards-container">
                <article class="movie-card">
                    <img src="https://www.themoviedb.org/t/p/w600_and_h900_face/5rhTDKUhPYvpdQIijFIs5VoWsON.jpg" alt="">
