<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieShelf</title>
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/movie.js" defer></script>
</head>
<body>
    
    <header>

        <h1 class="logo">MovieShelf</h1>

        <nav>
            <a href="index.html">HOME</a>
            <a href="">ABOUT</a>
        </nav>

    </header>

    <main>

        <section class="movie-page-hero-section">
            <!-- ui.js renders the hero section here. -->
        </section>

        <section class="movie-page-cast-section">
            <h3 class="movie-page-heading">CAST</h3>
            <div class="cast-cards-container">
                <!--ui.js renders cast cards here-->
            </div>
        </section>
        <section class="user-review-section">
            <h3 class="movie-page-heading">MY REVIEW</h3>
            <div class="user-review-container">
                <div class="user-review-container-top">
                    <div class="user-review-heading-wrapper">  
                        <h4 class="user-review-heading">Review heading goes here</h4>
                        <button id="edit-review-button">
                            <img src="./assets/icons/edit-muted.svg" alt="">
                        </button>
                    </div>
                    <div class="user-rating-container">
                        <p class="user-rating-label">My Rating:</p>
                        <p class="user-rating">?/10</p>
                        <img class="user-rating-star" src="./assets/icons/star-filled.svg" alt="">
                        <button>
                            <img src="./assets/icons/edit-muted.svg" alt="" id="edit-rating-button">
                        </button>
                        
                    </div>
                </div>

                <p class="user-review-body">Review body goes here</p>
                
                
            </div>
        </section>

    </main>

    <footer>
        Justin Ken Ramoso
    </footer>

    <dialog class="remove-from-collection-modal">
        <p class="remove-from-collection-prompt">Are you sure you want to remove this movie from your collection? Your rating and review will also be lost.</p>
        <button class="remove-from-collection-confirm">Remove</button>
        <button class="remove-from-collection-cancel">Cancel</button>
    </dialog>

    <dialog class="update-review-modal">
        <div>
            <div class="review-inputs-container">
                <input type="text" name="update-review-heading" id="update-review-heading" placeholder="Review title...">
                <textarea name="update-review-body" id="update-review-body" placeholder="Say something about the movie..."></textarea>
            </div>
            <div>
                <button class="update-review-confirm">Save</button>
                <button class="update-review-cancel">Cancel</button>
            </div>
        </div>
        
        
    </dialog>

    <dialog class="update-rating-modal">
        <div class="update-rating-container">
            <label for="user-new-rating">My Rating:</label>
            <input type="number" name="user-new-rating" id="user-new-rating" min="0" max="10" placeholder="10">
            <button class="update-rating-confirm">Save</button>
            <button class="update-rating-cancel">Cancel</button>
        </div>
      
    </dialog>

    


</body>
</html>
